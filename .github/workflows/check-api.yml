name: Check API Status

on:
  schedule:
    # This cron syntax means "every 5 minutes"
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows you to run it manually from the gt Actions tab

jobs:
  ping-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run API Check
        env:
          API_KEY: ${{ secrets.API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python check_api.py
